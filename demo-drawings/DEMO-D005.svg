<rect x="376.875" y="225.9375" width="146.25" height="268.125" fill="white" stroke="#233f5d" stroke-width="3"/><text x="450" y="360" text-anchor="middle" font-size="17">開口 120 × 220</text>
<line x1="300.9375" y1="360" x2="599.0625" y2="360" stroke="#8a9eb1" stroke-dasharray="9 5"/>
<line x1="450" y1="150" x2="450" y2="570" stroke="#8a9eb1" stroke-dasharray="9 5"/>
<g fill="none" stroke="#233f5d" stroke-width="1.5">
<path d="M315.9375 563 V602 M584.0625 563 V602"/>
<line x1="315.9375" y1="590" x2="584.0625" y2="590" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

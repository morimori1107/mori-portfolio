<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="707" viewBox="0 0 1000 707" role="img" aria-labelledby="title desc">
<title id="title">DEMO-D005 / DEMO-P004 / DEMO-B005 架空図面</title>
<desc id="desc">新規作成した説明用の架空図。部材寸法は厚み24、幅220、長さ320ミリメートル。架空図面 / 製造使用不可。</desc>

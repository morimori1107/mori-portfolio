<rect x="615.0625" y="343" width="43" height="34" fill="white"/><text x="636.0625" y="367" text-anchor="middle" font-size="19">320</text>
<text x="795" y="205" font-size="18">厚み t = 24</text>
<text x="795" y="235" font-size="14">構成数量 1個</text>
